# ---------------------------------------------------------------------------
# BOP-Hub -- Beneficial Outcome Pathway Hub
#
# NOTE: Jekyll does NOT reload this file while `jekyll serve` is running.
# Restart the server after every change here.
# ---------------------------------------------------------------------------

# --- identity --------------------------------------------------------------
title: BOP-Hub
tagline: The Beneficial Outcome Pathway Hub
description: >-
  A community-curated, FAIR knowledge base of Beneficial Outcome Pathways
  (BOPs): causal chains linking a beneficial exposure or intervention through
  key events to a beneficial health outcome. The beneficial counterpart to
  AOP-Wiki.

url: "https://tgx-um.github.io"
# Kept committed so a local `jekyll serve` matches production. CI overrides it
# with --baseurl "${{ steps.pages.outputs.base_path }}", so moving to a custom
# domain is a settings change, not a commit.
baseurl: "/bop-hub"

github_username: TGX-UM
github_repo: bop-hub
repository: TGX-UM/bop-hub
discussion_forum: github.com/TGX-UM/bop-hub/discussions

# --- FAIR: content IRIs must not depend on where the site is hosted --------
# Canonical IRIs are COMPUTED from this, never stored in a page. Moving from
# tgx-um.github.io/bop-hub/ to a custom domain must not invalidate an IRI.
canonical_base: "https://w3id.org/bop-hub"

id_prefixes:
  bop: "BOP"
  event: "BOPE"
  relationship: "BOPR"

# Front-matter keys that hold ontology CURIEs. Drives the annotation reverse
# lookup and the facets on browse/annotations.html.
annotation_slots:
  - interventions
  - taxa
  - sex
  - life_stage
  - diseases
  - phenotypes

# Diagram engine for BOP pages: `mermaid` or `table`. Setting this to `table`
# disables the Mermaid CDN script in one commit if it ever breaks.
diagram_engine: mermaid
mermaid_version: "11.4.1"

# --- build -----------------------------------------------------------------
markdown: kramdown
# No theme gem: the stylesheet is self-contained so the UM house style is not
# fighting a theme's own base rules.
plugins:
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from
  - jekyll-include-cache

# `incremental` is deliberately NOT enabled. This site is full of reverse
# lookups: adding a BOP must rebuild the event pages that count how many BOPs
# cite them. Incremental builds would leave those stale and internally
# inconsistent, which no test catches.

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - .jekyll-cache/
  - tools
  - README.md
  - CONTRIBUTING.md
  - CODE_OF_CONDUCT.md
  - NOTICE
  - LICENSE
  - LICENSE-CONTENT
  - CITATION.cff
  - .ruby-version

# --- collections -----------------------------------------------------------
collections:
  bops:
    output: true
    permalink: /bops/:path/
  events:
    output: true
    permalink: /events/:path/
  relationships:
    output: true
    permalink: /relationships/:path/
  annotations:
    output: true
    permalink: /annotations/:path/

# `type:` must be the PLURAL collection key. A typo here silently yields
# unstyled pages with no error.
defaults:
  - scope: {path: "", type: "bops"}
    values: {layout: "bop-page"}
  - scope: {path: "", type: "events"}
    values: {layout: "event-page"}
  - scope: {path: "", type: "relationships"}
    values: {layout: "relationship-page"}
  - scope: {path: "", type: "annotations"}
    values: {layout: "annotation-page"}
  - scope: {path: ""}
    values: {layout: "default", sitemap: false}
