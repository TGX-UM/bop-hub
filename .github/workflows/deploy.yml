# Build and deploy the Jekyll site to GitHub Pages.
#
# Requires Settings -> Pages -> Source = "GitHub Actions". On the legacy
# branch-based path GitHub runs its own Jekyll with a plugin allowlist and
# silently drops jekyll-redirect-from, which looks like a broken layout rather
# than the wrong builder.
name: Deploy Jekyll site to Pages

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '**/*.md.license'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'NOTICE'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 0
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      # --baseurl from configure-pages is what makes the move to a custom
      # domain a settings change rather than a commit. Do not hardcode it.
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
