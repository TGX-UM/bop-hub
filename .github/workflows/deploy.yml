# Build and deploy the Jekyll site to GitHub Pages.
#
# Requires Settings -> Pages -> Source = "GitHub Actions". On the legacy
# branch-based path GitHub runs its own Jekyll with a plugin allowlist and
# silently drops jekyll-redirect-from, which looks like a broken layout rather
# than the wrong builder.
name: Deploy Jekyll site to Pages

on:
  workflow_dispatch:
  # A quiet repository has its Pages workflow disabled after 60 days, which
  # looks like a broken site rather than a disabled workflow. A weekly build
  # also refreshes api/v1's `generated`.
  schedule:
    - cron: '0 4 * * 1'
  push:
    branches: [main]
    paths-ignore:
      - '.github/ISSUE_TEMPLATE/**'
      - '**/*.md.license'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'NOTICE'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          cache-version: 0
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install content tooling
        run: pip install -r tools/requirements.txt
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6
      # --baseurl from configure-pages is what makes the move to a custom
      # domain a settings change rather than a commit. Do not hardcode it.
      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      # AFTER the Jekyll build, never before: Jekyll deletes anything in the
      # destination it did not generate, so an api/v1 written first is thrown
      # away silently and the site deploys with a dead API.
      - name: Export the read API
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python tools/export.py --out _site/api/v1 --site-url "${BASE_URL/#http:\/\//https://}"
      # A broken export would otherwise deploy a perfect-looking site whose
      # API is missing, and nothing would go red.
      - name: Export RDF
        run: python tools/export_rdf.py --graph _site/api/v1/graph.json --out _site/rdf
      - name: Check the API was written
        run: |
          test -f _site/api/v1/index.json || { echo "api/v1/index.json is missing"; exit 1; }
          for c in bops events relationships annotations; do
            on_disk=$(ls -1 "_${c}" | wc -l)
            in_dump=$(python3 -c "import json;print(json.load(open('_site/api/v1/index.json'))['counts']['$c'])")
            echo "$c: $on_disk on disk, $in_dump in the dump"
            [ "$on_disk" = "$in_dump" ] || { echo "count mismatch for $c"; exit 1; }
          done
          test -s _site/rdf/bop-hub.ttl || { echo "rdf/bop-hub.ttl is missing or empty"; exit 1; }
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
