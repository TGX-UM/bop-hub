<header class="site-head">
  <div class="wrap">
    <a class="site-logo" href="{{ '/' | relative_url }}">
      <img src="{{ '/assets/img/bop-hub-logo.svg' | relative_url }}"
           width="420" height="170" alt="BOP-Hub">
    </a>
    <span class="site-tag">{{ site.tagline }}</span>
    <nav class="site-nav" aria-label="Main">
      <a href="{{ '/browse/bops/' | relative_url }}"{% if page.url contains '/browse/bops' %} aria-current="page"{% endif %}>BOPs</a>
      <a href="{{ '/browse/events/' | relative_url }}"{% if page.url contains '/browse/events' %} aria-current="page"{% endif %}>Events</a>
      <a href="{{ '/browse/relationships/' | relative_url }}"{% if page.url contains '/browse/relationships' %} aria-current="page"{% endif %}>Relationships</a>
      <a href="{{ '/browse/annotations/' | relative_url }}"{% if page.url contains '/browse/annotations' %} aria-current="page"{% endif %}>Terms</a>
      <a href="{{ '/about/' | relative_url }}"{% if page.url contains '/about' %} aria-current="page"{% endif %}>About</a>
      <a href="{{ '/contribute/' | relative_url }}"{% if page.url contains '/contribute' %} aria-current="page"{% endif %}>Contribute</a>
    </nav>
  </div>
</header>
